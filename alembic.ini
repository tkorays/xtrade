# Minimal alembic.ini -- the data layer's env.py reads DSN from
# XTRADE_DATA__DATABASE__URL or Config; we don't store any DSN here.
[alembic]
# Path to the migration scripts relative to this file.
script_location = src/xtrade/data/migrations

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Set in [tool.alembic] in pyproject.toml; kept here for the CLI's
# own use when invoked outside the uv environment.
prepend_sys_path = .

# Logging -- referenced from env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S